services:
  - type: web
    name: sensorhub-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: sensorhub-db, property: connectionString }
databases:
  - name: sensorhub-db
    plan: free