# .github/workflows/ci.yml
name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # 1. Levantamos PostgreSQL real como servicio para las pruebas
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
        
      - run: pip install -r requirements.txt && pip install pytest pytest-cov ruff mypy
      
      - name: Lint
        run: ruff check .
        
      - name: Types
        run: mypy app --ignore-missing-imports
        
      - name: Ejecutar Migraciones (Smoke Test DB)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          # Asegura que Alembic aplique las migraciones en PostgreSQL limpio
          alembic upgrade head

      - name: Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: pytest --cov=app --cov-fail-under=80