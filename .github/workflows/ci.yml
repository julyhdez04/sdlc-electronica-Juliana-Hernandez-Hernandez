# .github/workflows/ci.yml
name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
        
      - run: pip install -r requirements.txt && pip install pytest pytest-cov ruff mypy
      
      - name: Lint
        run: ruff check .
        
      - name: Types
        run: mypy app --ignore-missing-imports
        
      - name: Ejecutar Migraciones y Smoke Test (DB)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          alembic upgrade head
          # Aquí puedes añadir tu script de smoke test si lo tienes separado, ej: python -m pytest tests/smoke_test.py

      - name: Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: pytest --cov=app --cov-fail-under=80

  # Escaneo de seguridad con Trivy
  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Construir imagen local para escaneo
        run: docker build -t sensorhub:latest .

      - name: Ejecutar Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sensorhub:latest'
          format: 'table'
          exit-code: '0' # Pon en '1' si quieres que falle por vulnerabilidades críticas
          severity: 'CRITICAL,HIGH'

  # Crear Issue automático si falla en main
  auto-issue:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Crear Issue por fallo en Pipeline de Main
        uses: dacbd/create-issue-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "🚨 Alerta: El pipeline de CI falló en la rama main"
          body: |
            El último commit en la rama `main` ha roto el pipeline de integración continua. 
            Por favor, revise las acciones de GitHub para solucionar el error a la brevedad.
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.sha }}